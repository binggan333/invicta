spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/utcpay_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:invicta_readonly}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: true
      maximum-pool-size: 3
      minimum-idle: 0
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 2s

invicta:
  mail:
    enabled: ${INVICTA_MAIL_ENABLED:false}
  legacy-api:
    base-url: ${LEGACY_API_BASE_URL:https://api-sandbox.payprotocol.network}

mail:
  configs:
    - host: ${MAIL_HOST:127.0.0.1}
      port: ${MAIL_PORT:1025}
      username: ${MAIL_USERNAME:no-reply@invicta.local}
      password: ${MAIL_PASSWORD:}
      default-encoding: UTF-8
      properties:
        mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
        mail.smtp.ssl.enable: ${MAIL_SMTP_SSL_ENABLED:false}

logging:
  level:
    com.invicta: INFO
