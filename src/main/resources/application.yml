server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: invicta
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

invicta:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-32chars}
    token-ttl: ${JWT_TTL:PT8H}
    code-ttl: ${EMAIL_CODE_TTL:PT5M}
  mail:
    enabled: ${INVICTA_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@invicta.local}
  legacy-api:
    token: ${LEGACY_API_TOKEN:}
