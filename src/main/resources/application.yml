server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: invicta
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  messages:
    basename: i18n/messages
    default-locale: en_US
    fallback-to-system-locale: false
    encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

invicta:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-32chars}
    token-ttl: ${JWT_TTL:PT8H}
    code-ttl: ${EMAIL_CODE_TTL:PT1M}
    code-cooldown: ${EMAIL_CODE_COOLDOWN:PT1M}
  mail:
    enabled: ${INVICTA_MAIL_ENABLED:false}
    app-name: ${INVICTA_MAIL_APP_NAME:Invicta}
  legacy-api:
    token: ${LEGACY_API_TOKEN:}
