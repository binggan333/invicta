server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: invicta
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/utcpay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:invicta_readonly}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: true
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

invicta:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-32chars}
    token-ttl: ${JWT_TTL:PT8H}
    code-ttl: ${EMAIL_CODE_TTL:PT5M}
  mail:
    enabled: ${INVICTA_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@invicta.local}
  legacy-api:
    base-url: ${LEGACY_API_BASE_URL:http://127.0.0.1:8080}
    token: ${LEGACY_API_TOKEN:}
