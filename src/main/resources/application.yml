server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: invicta
  config:
    # 本地 .env 已加入 .gitignore，便于 IntelliJ 直接启动且不会提交真实配置。
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  messages:
    basename: i18n/messages
    default-locale: en_US
    fallback-to-system-locale: false
    encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{36} - %msg%n"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.invicta.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

invicta:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-32chars}
    token-ttl: ${JWT_TTL:PT8H}
    code-ttl: ${EMAIL_CODE_TTL:PT1M}
    code-cooldown: ${EMAIL_CODE_COOLDOWN:PT1M}
  mail:
    enabled: ${INVICTA_MAIL_ENABLED:false}
    app-name: ${INVICTA_MAIL_APP_NAME:Invicta}
  legacy-api:
    token: ${LEGACY_API_TOKEN:}
    api-key: ${LEGACY_API_KEY:}
    secret-key: ${LEGACY_API_SECRET:}
