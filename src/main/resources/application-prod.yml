spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: true
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL:false}

invicta:
  auth:
    jwt-secret: ${JWT_SECRET}
  mail:
    enabled: true
  legacy-api:
    base-url: ${LEGACY_API_BASE_URL}

mail:
  configs:
    - host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:465}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      default-encoding: UTF-8
      properties:
        mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
        mail.smtp.socketFactory.port: ${MAIL_PORT:465}
        mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
        mail.smtp.socketFactory.fallback: false
        mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
        mail.smtp.timeout: ${MAIL_TIMEOUT:5000}
        mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

logging:
  level:
    root: INFO
    com.invicta: INFO
